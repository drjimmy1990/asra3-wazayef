#PROXY-START/
# ==============================================================================
# aaPanel Nginx Reverse Proxy Config for https://asra3.com -> 127.0.0.1:3645
# Drop-in replacement for /www/server/panel/vhost/nginx/proxy/asra3.com/*.conf
# ==============================================================================

# Immutable 1-Year Cache for fingerprinted Next.js assets & self-hosted fonts
# Longest ^~ prefix match beats aaPanel's static regexes and avoids expires 1m;
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3645;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /fonts/ {
    proxy_pass http://127.0.0.1:3645;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ / {
    # Allow up to 15 MB CV uploads (PDF / DOCX) without colliding with parent server{} directives
    client_max_body_size 15M;

    proxy_pass http://127.0.0.1:3645;
    proxy_http_version 1.1;

    # Never serve stale proxy-cached HTML or dynamic manifests (/llms.txt)
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
#PROXY-END/
